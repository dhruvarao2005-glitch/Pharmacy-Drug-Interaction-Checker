<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Pharmacy Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fa;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .login-container {
            width: 400px;
            background: white;

            padding: 40px;

            border-radius: 12px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            font-size: 48px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #174a7e;
            margin: 0;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-top: 8px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;

            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 13px;

            border: 1px solid #cbd5e1;
            border-radius: 6px;

            font-size: 15px;

            margin-bottom: 18px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .login-button {
            width: 100%;

            padding: 13px;

            border: none;
            border-radius: 6px;

            background: #2563eb;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .login-button:hover {
            background: #174a7e;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;

            border: 1px solid #fecaca;

            padding: 10px;

            border-radius: 6px;

            margin-bottom: 18px;

            text-align: center;
        }

        .footer {
            text-align: center;

            margin-top: 25px;

            color: #94a3b8;
            font-size: 13px;
        }

    </style>

</head>

<body>

    <div class="login-container">

        <div class="logo">
            🏥
        </div>

        <h1>Pharmacy Login</h1>

        <p class="subtitle">
            Drug Interaction Checker
        </p>

        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}

        <form method="POST">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <button
                type="submit"
                class="login-button">

                🔐 Login

            </button>

        </form>

        <div class="footer">
            Pharmacy Drug Interaction Checker
        </div>

    </div>

</body>

</html>
